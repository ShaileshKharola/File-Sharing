<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📦 Shared Files</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="fw-bold"><i class="fas fa-share-alt me-2 text-primary"></i>Shared Files</h4>
                    <span class="badge bg-secondary">{{ files|length }} file(s)</span>
                </div>

                <ul class="list-group mb-4">
                    {% for file in files %}
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <span><i class="fas fa-file me-2 text-secondary"></i>{{ file }}</span>
                        <a href="/download/{{ share_id }}/{{ file }}" class="btn btn-sm btn-outline-primary">
                            <i class="fas fa-download"></i>
                        </a>
                    </li>
                    {% endfor %}
                </ul>

                <div class="d-flex gap-3">
                    <a href="/download/{{ share_id }}" class="btn btn-success flex-grow-1">
                        <i class="fas fa-file-archive me-2"></i>Download All as ZIP
                    </a>
                    <a href="/" class="btn btn-outline-secondary">
                        <i class="fas fa-home"></i> Home
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
